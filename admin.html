<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة | دليلك الرقمي</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/assets/style.css"></head><body>
<header class="top"><div class="wrap bar"><a class="brand" href="/"><img src="/assets/logo-96.png" width="40" height="40" alt="الشعار"><span>دليلك الرقمي | الإدارة</span></a><button class="btn" id="out" hidden type="button">خروج</button></div></header>
<main class="wrap"><section class="authbox" id="login"><h1>دخول المالك</h1><form id="lf"><label>البريد<input id="le" type="email" dir="ltr" autocomplete="email" required></label><label>كلمة المرور<input id="lp" type="password" dir="ltr" autocomplete="current-password" required></label><button class="btn big" type="submit">دخول</button> <button class="btn" type="button" id="forgot">نسيت كلمة المرور</button><p id="lm" role="status"></p></form></section>
<section id="panel" hidden><h1>مقال جديد</h1><form id="pf" class="authbox" style="max-width:none"><label>العنوان<input id="t" required></label><label>التصنيف<input id="c" value="تطبيقات"></label><label>وصف قصير (يظهر في قوقل)<input id="d" required maxlength="160"></label><label>النص (اكتب ## قبل العنوان الفرعي)<textarea id="b" rows="12" required style="width:100%;padding:10px;font:inherit;border:1px solid #c5cce0;border-radius:10px"></textarea></label><button class="btn big" type="submit">نشر المقال</button><p id="pm" role="status"></p></form>
<h2>مقالاتك</h2><div id="list"></div></section></main><script src="/assets/admin.js" defer></script></body></html>
