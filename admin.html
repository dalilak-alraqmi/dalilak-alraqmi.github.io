<!doctype html><html lang="ar" dir="rtl" data-theme="logo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة | دليلك الرقمي</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/assets/style.css"><script>try{var d=document.documentElement,s=localStorage;if(s.dl_theme)d.dataset.theme=s.dl_theme;if(s.dl_font)d.dataset.font=s.dl_font}catch(e){}</script></head><body>
<header class="top"><div class="wrap bar"><a class="brand" href="/"><img src="/assets/logo-96.png" width="40" height="40" alt="الشعار"><span>دليلك الرقمي | الإدارة</span></a><div class="acts"><button class="btn" id="out" hidden type="button">خروج</button></div></div></header>
<main class="wrap"><section class="authbox" id="login"><h1>دخول المالك</h1><form id="lf"><label>البريد<input id="le" type="email" dir="ltr" autocomplete="email" required></label><label>كلمة المرور<input id="lp" type="password" dir="ltr" autocomplete="current-password" required></label><button class="btn big" type="submit">دخول</button> <button class="btn ghost2" type="button" id="forgot">نسيت كلمة المرور</button><p id="lm" role="status"></p></form><p>ليس لديك حساب؟ <a href="/account.html">أنشئ حسابًا</a> ثم أرسل بريدك لتتم إضافتك كمالك.</p></section>
<section id="panel" hidden><h1>إعدادات المظهر</h1><form id="sf" class="authbox" style="max-width:none"><label>القالب<select id="theme"></select></label><label>الخط<select id="font"></select></label><button class="btn" type="submit">حفظ المظهر</button><p id="sm" role="status"></p></form>
<h1>مقال جديد</h1><form id="pf" class="authbox" style="max-width:none"><label>العنوان<input id="t" required></label><label>القسم<select id="c"><option>التطبيقات</option><option>المقالات</option><option>أخبار التقنية</option></select></label><label>وصف قصير (يظهر في قوقل)<input id="d" required maxlength="160"></label><label>النص (اكتب ## قبل العنوان الفرعي)<textarea id="b" rows="12" required></textarea></label><button class="btn big" type="submit">نشر المقال</button><p id="pm" role="status"></p></form>
<h2>مقالاتك</h2><p><button class="btn danger" id="delsamples" type="button">حذف كل المقالات التجريبية</button></p><div id="list"></div></section></main><script src="/assets/sb.js"></script><script src="/assets/admin.js"></script></body></html>
